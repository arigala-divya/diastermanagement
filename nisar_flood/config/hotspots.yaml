# Top-20 river flood hotspots monitored with NISAR S-SAR GCOV.
#
# Chosen from CWC / NDMA flood-prone river stretches with recurrent damage.
# Each AOI is a square of side 2*half_km centred on (lat, lon). Edit freely;
# the pipeline picks up changes on the next run.
#
# Alert thresholds apply to *new* water: pixels that are water in the latest
# scene but were dry in the baseline (the driest scene on the same orbit
# track and frame). Override any of them per hotspot under `thresholds:`.

defaults:
  half_km: 15
  history_start: "2026-03-01"    # earliest scene considered
  baseline_months: [1, 2, 3, 4, 5, 11, 12]   # prefer dry-season baselines
  thresholds:
    watch_km2: 5          # new water area that triggers WATCH
    alert_km2: 20         # new water area that triggers FLOOD ALERT
    watch_increase_pct: 25    # % growth in water extent over baseline
    alert_increase_pct: 75
    min_pct_km2: 1        # % rules only fire above this absolute area
    min_patch_km2: 2      # ALERT also needs one contiguous patch this big

hotspots:
